<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" role="img" aria-labelledby="t">
  <title id="t">Schema: Microsoft Entra, Anwendung registrieren. Name MailVault, Kontotyp mit persönlichen Microsoft-Konten, Umleitungs-URI öffentlicher Client http://localhost; danach die Anwendungs-ID kopieren.</title>
  <style>
    text { font-family: "Segoe UI", Arial, sans-serif; fill: #1a1f26; }
    .m { fill: #535a65; font-size: 14px; }
    .h { font-size: 22px; font-weight: 600; }
    .l { font-size: 15px; font-weight: 600; }
    .v { font-size: 15px; }
    .code { font-family: Consolas, "Courier New", monospace; font-size: 16px; }
    .k { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .n { fill: #ffffff; font-size: 14px; font-weight: 600; }
  </style>
  <rect width="880" height="520" fill="#f4f5f7"/>
  <rect x="24" y="24" width="520" height="472" rx="12" fill="#ffffff" stroke="#c3c8d0"/>
  <text x="48" y="58" class="m">entra.microsoft.com → App-Registrierungen → Neue Registrierung</text>
  <line x1="24" y1="74" x2="544" y2="74" stroke="#dde0e5"/>
  <text x="48" y="110" class="h">Anwendung registrieren</text>

  <circle cx="36" cy="146" r="11" fill="#1f4e8c"/><text x="36" y="151" class="n" text-anchor="middle">1</text>
  <text x="56" y="151" class="l">Name</text>
  <rect x="56" y="162" width="460" height="38" rx="4" fill="#ffffff" stroke="#c3c8d0"/>
  <text x="68" y="187" class="v">MailVault</text>

  <circle cx="36" cy="236" r="11" fill="#1f4e8c"/><text x="36" y="241" class="n" text-anchor="middle">2</text>
  <text x="56" y="241" class="l">Unterstützte Kontotypen</text>
  <circle cx="66" cy="268" r="7" fill="none" stroke="#535a65"/>
  <text x="82" y="273" class="m">Nur Konten in diesem Organisationsverzeichnis</text>
  <circle cx="66" cy="296" r="7" fill="none" stroke="#1f4e8c" stroke-width="2"/><circle cx="66" cy="296" r="3.5" fill="#1f4e8c"/>
  <text x="82" y="294" class="v">Konten in einem beliebigen Organisationsverzeichnis</text>
  <text x="82" y="313" class="v">und persönliche Microsoft-Konten</text>

  <circle cx="36" cy="352" r="11" fill="#1f4e8c"/><text x="36" y="357" class="n" text-anchor="middle">3</text>
  <text x="56" y="357" class="l">Umleitungs-URI</text>
  <rect x="56" y="368" width="236" height="38" rx="4" fill="#ffffff" stroke="#c3c8d0"/>
  <text x="66" y="392" class="m">Öffentlicher Client/nativ</text>
  <path d="M276 382 l5 5 l5 -5" fill="none" stroke="#535a65" stroke-width="1.5"/>
  <rect x="300" y="368" width="216" height="38" rx="4" fill="#ffffff" stroke="#1f4e8c" stroke-width="2"/>
  <text x="312" y="393" class="code">http://localhost</text>

  <rect x="56" y="432" width="128" height="38" rx="4" fill="#1f4e8c"/>
  <text x="120" y="457" class="k" text-anchor="middle">Registrieren</text>

  <path d="M556 260 h26 m-10 -9 l10 9 l-10 9" fill="none" stroke="#535a65" stroke-width="2"/>

  <rect x="596" y="24" width="260" height="472" rx="12" fill="#ffffff" stroke="#c3c8d0"/>
  <text x="616" y="58" class="m">Übersicht</text>
  <line x1="596" y1="74" x2="856" y2="74" stroke="#dde0e5"/>
  <text x="616" y="110" class="h">MailVault</text>
  <circle cx="616" cy="150" r="11" fill="#1f4e8c"/><text x="616" y="155" class="n" text-anchor="middle">4</text>
  <text x="634" y="155" class="l">Anwendungs-ID (Client)</text>
  <rect x="616" y="168" width="220" height="62" rx="6" fill="#fff6c4" stroke="#e6c94a"/>
  <text x="626" y="193" class="code">00000000-0000-</text>
  <text x="626" y="215" class="code">0000-0000-000000000000</text>
  <text x="616" y="260" class="m">Demo-Wert. Nur diese ID</text>
  <text x="616" y="279" class="m">braucht MailVault – kein</text>
  <text x="616" y="298" class="m">Geheimnis anlegen.</text>
  <text x="616" y="340" class="l">API-Berechtigungen</text>
  <text x="616" y="362" class="m">Microsoft Graph, delegiert:</text>
  <text x="616" y="384" class="code">IMAP.AccessAsUser.All</text>
  <text x="616" y="406" class="code">POP.AccessAsUser.All</text>
  <text x="616" y="428" class="code">offline_access</text>
  <text x="616" y="450" class="code">openid email profile</text>
</svg>
