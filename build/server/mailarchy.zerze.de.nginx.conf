# nginx-Konfiguration für mailarchy.zerze.de (statische Seite, Pakete, signierte Update-Listen)
# und für den früheren Namen mailvault.zerze.de.
# Liegt auf dem Server als /etc/nginx/sites-enabled/mailarchy.zerze.de.conf (ersetzt mailvault.zerze.de.conf).
# Webroot: /var/www/mailvault.zerze.de  (Ordnername bleibt; dorthin lädt build\release.ps1 per scp)
# Zertifikate (certbot.timer erneuert beide):
#   certbot certonly --webroot -w /var/www/mailvault-acme -d mailarchy.zerze.de
#   certbot certonly --webroot -w /var/www/mailvault-acme -d mailvault.zerze.de   (besteht schon)
# Protokolle: eigener Ordner /var/log/nginx/mailvault/, täglich gedreht, nach 7 Tagen gelöscht
#   (build/server/mailvault.logrotate -> /etc/logrotate.d/mailvault). So steht es in der Datenschutzerklärung.
#   Eigener Ordner, weil die allgemeine Regel /var/log/nginx/*.log sonst dieselben Dateien mit 14 Tagen erfasst.
#
# mailvault.zerze.de: Programme bis Version 0.7 fragen dort nach Updates. /updates/ und /download/ werden deshalb
# dauerhaft weiter ausgeliefert (gleicher Webroot, gleiche signierte Listen); alle anderen Seiten leiten auf
# mailarchy.zerze.de weiter.

server {
    listen 80;
    listen [::]:80;
    server_name mailarchy.zerze.de mailvault.zerze.de;

    # ACME-Challenge muss über http erreichbar bleiben, sonst scheitert die Erneuerung still.
    location ^~ /.well-known/acme-challenge/ { root /var/www/mailvault-acme; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mailarchy.zerze.de;

    ssl_certificate     /etc/letsencrypt/live/mailarchy.zerze.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailarchy.zerze.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mailvault.zerze.de;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/mailvault/access.log;
    error_log  /var/log/nginx/mailvault/error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'unsafe-inline'; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;

    types {
        text/html html;
        text/css css;
        text/javascript js;
        application/json json;
        image/svg+xml svg;
        image/png png;
        font/woff2 woff2;
        application/zip zip;
        text/plain sig sha256 txt;
    }

    # Achtung: add_header in einem location-Block hebt die Sicherheits-Kopfzeilen oben auf, daher hier nur "expires".
    location ^~ /.well-known/acme-challenge/ { root /var/www/mailvault-acme; }
    location = /index.html { expires -1; }
    location ~* \.(css|js)$ { expires -1; }
    location /schriften/ { expires max; }

    # Update-Listen: nie zwischenspeichern, sonst sehen Programme neue Versionen verspätet
    location /updates/ { expires -1; }

    # Pakete sind unveränderlich (Versionsnummer im Namen)
    location /download/ { expires max; }

    location / { try_files $uri $uri/ =404; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mailvault.zerze.de;

    ssl_certificate     /etc/letsencrypt/live/mailvault.zerze.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mailvault.zerze.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/mailvault.zerze.de;
    charset utf-8;

    access_log /var/log/nginx/mailvault/access.log;
    error_log  /var/log/nginx/mailvault/error.log warn;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;

    types {
        application/json json;
        application/zip zip;
        text/plain sig sha256 txt;
    }

    location ^~ /.well-known/acme-challenge/ { root /var/www/mailvault-acme; }
    # Für installierte Programme bis 0.7: Update-Listen und Pakete wie bisher
    location /updates/ { expires -1; try_files $uri =404; }
    location /download/ { expires max; try_files $uri =404; }
    # Alles andere: neuer Name
    location / { return 301 https://mailarchy.zerze.de$request_uri; }
}
